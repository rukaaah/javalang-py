[project]
name = "javalang-py"
version = "0.1.0"
description = "Implementação das classes String, Integer e Float da especificação Java SE 8 em Python."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Versões fixadas para garantir build reprodutível.
# Sem o pin, a CI instala sempre a release mais recente de cada ferramenta:
# o ruff 0.16.0 ampliou o conjunto de regras padrão (I001, B009, B136, B161,
# RUF013, E790) e passou a reprovar código que não mudou uma linha desde a
# baseline v1.0.0. Toda atualização de ferramenta deve ser deliberada, via PR.
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.1",
    "ruff==0.15.22",
    "mypy==2.4.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=javalang"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
# Ignorar as regras de snake_case exigidas pelo Python,
# pois o professor determinou o uso de camelCase (ex: charAt)
lint.ignore = ["N802", "N803", "N815"] 

[tool.mypy]
strict = true